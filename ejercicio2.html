<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UT3Actividad1 Ejercicio 2</title>
</head>
<body>
    <!-- Modifica el script anterior para que nos muestre también un mensaje si hoy es tu cumpleaños -->
     
    <script>
        let $fecha = new Date("1995/10/6");
        let $fecha_hoy = new Date;
        let $edad = 0;
        $edad = $fecha_hoy.getFullYear() - $fecha.getFullYear();

        if ($fecha.getMonth() > $fecha_hoy.getMonth()) {
            --$edad;
        } else if ($fecha.getMonth() == $fecha_hoy.getMonth()) {
            if ($fecha.getDate() > $fecha_hoy.getDate()) {
                --$edad;
            } else if ($fecha.getDate() == $fecha_hoy.getDate()) {
                document.write("<h1>¡ES TU CUMPLE!</h1>")
            }
        }

        document.write(`Tienes ${$edad} años.`);
    </script>
</body>
</html>
